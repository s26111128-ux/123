<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friendship Guestbook</title>
  <!-- 引入 Google Fonts 歐美風格字型 (Outfit + Plus Jakarta Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       【1. 全局樣式與主題變數定義】
       方便後續修改顏色、發光效果與轉場時間
       ========================================================================== */
    :root {
      /* 主背景顏色 (深色歐美高質感質感) */
      --bg-color: #0d0f17;
      
      /* 卡片背景 (半透明玻璃擬態 Glassmorphism) */
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      
      /* 焦點卡片發光色彩 (霓虹漸層色，可自由調整) */
      --accent-color-1: #6366f1; /* 藍紫色 */
      --accent-color-2: #ec4899; /* 桃粉色 */
      --highlight-glow: rgba(99, 102, 241, 0.4); /* 高亮時的陰影發光顏色 */
      
      /* 文字顏色 */
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-accent: #38bdf8;

      /* 動畫轉場速度 */
      --transition-speed: 0.5s;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem;
      /* 歐美風微光背景漸層效果 */
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.15) 0%, transparent 40%);
      background-attachment: fixed;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 30%, var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    /* ==========================================================================
       【2. 載入中酷炫動畫 (Loading Spinner)】
       ========================================================================== */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 50vh;
    }

    /* 雙環炫光旋轉動畫 */
    .spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: var(--accent-color-1);
      border-right-color: var(--accent-color-2);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 1.5rem;
      box-shadow: 0 0 15px var(--highlight-glow);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #loading p {
      font-family: 'Outfit', sans-serif;
      font-size: 1.2rem;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      animation: pulse 1.5s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    /* ==========================================================================
       【3. 瀑布流版型 (Masonry Layout)】
       ========================================================================== */
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .masonry-grid {
      /* 利用 CSS Column 實現經典瀑布流 */
      column-count: 3; 
      column-gap: 1.5rem;
      display: none; /* 預設隱藏，載入完成後用 JS 顯示 */
    }

    /* 響應式斷點設計 */
    @media (max-width: 900px) {
      .masonry-grid { column-count: 2; }
    }
    @media (max-width: 600px) {
      .masonry-grid { column-count: 1; }
    }

    /* ==========================================================================
       【4. 留言卡片樣式與焦點輪播特效】
       ========================================================================== */
    .card {
      /* 防止卡片被跨欄截斷 */
      break-inside: avoid;
      margin-bottom: 1.5rem;
      
      /* 玻璃擬態樣式 */
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.5rem;
      
      /* 平滑動畫過渡 */
      transition: all var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    /* 卡片頭部：名字與時間 */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .card-author {
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 1.15rem;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* 歐美風頭像小裝飾 */
    .avatar-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-color-1), var(--accent-color-2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: bold;
      color: #fff;
    }

    .card-time {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* 卡片留言內容 */
    .card-body {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #e5e7eb;
      word-break: break-word;
    }

    /* --------------------------------------------------
       【重點特效】：被選中的高亮 (Highlight) 卡片樣式
       -------------------------------------------------- */
    .card.highlight {
      transform: scale(1.05); /* 稍微放大卡片 */
      border-color: var(--accent-color-1); /* 亮色邊框 */
      box-shadow: 
        0 10px 30px -10px var(--highlight-glow),
        0 0 20px 2px rgba(236, 72, 153, 0.3); /* 霓虹漸層發光 */
      z-index: 10;
      background: rgba(255, 255, 255, 0.1);
    }

    /* 卡片高亮時的上方彩虹光條特效 */
    .card.highlight::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--accent-color-1), var(--accent-color-2));
    }

    /* --------------------------------------------------
       【重點特效】：未被選中 (Dimmed) 卡片樣式
       -------------------------------------------------- */
    .card.dimmed {
      opacity: 0.35; /* 降低透明度 */
      filter: blur(1.5px); /* 微模糊效果 */
      transform: scale(0.98); /* 稍微縮小 */
    }
  </style>
</head>
<body>

  <header>
    <h1>Friendship Wall</h1>
    <p>來自朋友們的悄悄話．動態展示區</p>
  </header>

  <div class="container">
    <!-- 1. 載入中酷炫動畫 -->
    <div id="loading">
      <div class="spinner"></div>
      <p>FETCHING MESSAGES...</p>
    </div>

    <!-- 2. 瀑布流留言牆容器 -->
    <div id="masonry-grid" class="masonry-grid"></div>
  </div>

  <script>
    /* ==========================================================================
       【5. JavaScript 邏輯控制區】
       ========================================================================== */

    // Google 試算表 CSV 網址
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRui0YoQv7ayzy5_vEY-upzlzIaqniANv-4ILn1y8kRvG7pSQ4tZ-voRNsTMTSUrDdIGwprUmqZ8oM_/pub?output=csv';

    // --------------------------------------------------------------------------
    // 【參數設定】：在此處修改輪播時間 (單位：毫秒，3000 = 3 秒)
    // --------------------------------------------------------------------------
    const ROTATE_INTERVAL = 3000;

    let cardsData = [];       // 儲存解析後的 CSV 資料
    let currentIndex = -1;    // 當前高亮的卡片索引
    let carouselTimer = null; // 計時器物件

    // 頁面載入後執行
    document.addEventListener('DOMContentLoaded', () => {
      fetchMessages();
    });

    /**
     * 從 Google 試算表 Fetch CSV 資料
     */
    async function fetchMessages() {
      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error('網絡回應不正常');
        
        const csvText = await response.text();
        cardsData = parseCSV(csvText);

        // 隱藏 Loading 動畫，顯示瀑布流網格
        document.getElementById('loading').style.display = 'none';
        const grid = document.getElementById('masonry-grid');
        grid.style.display = 'block';

        // 動態生成卡片
        renderCards(cardsData);

        // 啟動 3 秒輪播特效
        if (cardsData.length > 0) {
          startCarousel();
        }
      } catch (error) {
        console.error('讀取資料失敗:', error);
        document.getElementById('loading').innerHTML = `
          <p style="color: #ef4444;">載入失敗，請稍後再試。</p>
        `;
      }
    }

    /**
     * 魯棒性 CSV 解析器 (Robust CSV Parser)
     * 能夠正確處理解析留言內容中包含「逗號 (,)」或「換行」的情況
     */
    function parseCSV(text) {
      const lines = [];
      let row = [];
      let inQuotes = false;
      let currentToken = '';

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (inQuotes && nextChar === '"') { // 處理雙引號轉義 ""
            currentToken += '"';
            i++;
          } else {
            inQuotes = !inQuotes; // 切換引號狀態
          }
        } else if (char === ',' && !inQuotes) { // 遇到非引號內的逗號，代表欄位分隔
          row.push(currentToken.trim());
          currentToken = '';
        } else if ((char === '\r' || char === '\n') && !inQuotes) { // 遇到換行
          if (char === '\r' && nextChar === '\n') i++; // 處理 \r\n
          row.push(currentToken.trim());
          if (row.some(field => field !== '')) {
            lines.push(row);
          }
          row = [];
          currentToken = '';
        } else {
          currentToken += char;
        }
      }
      
      if (currentToken || row.length > 0) {
        row.push(currentToken.trim());
        lines.push(row);
      }

      // 假設第 0 行是標題列 (時間戳記, 姓名, 敲敲話)，進行過濾轉換
      const dataRows = lines.slice(1);
      
      return dataRows.map(cols => {
        return {
          timestamp: cols[0] || '剛剛',
          name: cols[1] || '匿名朋友',
          message: cols[2] || '（無留言內容）'
        };
      });
    }

    /**
     * 將資料動態渲染成卡片 HTML
     */
    function renderCards(data) {
      const grid = document.getElementById('masonry-grid');
      grid.innerHTML = ''; // 清空容器

      data.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.setAttribute('data-index', index);

        // 取得名字第一個字作為 Avatar
        const firstLetter = item.name.charAt(0).toUpperCase();

        card.innerHTML = `
          <div class="card-header">
            <div class="card-author">
              <div class="avatar-icon">${firstLetter}</div>
              <span>${escapeHTML(item.name)}</span>
            </div>
            <span class="card-time">${escapeHTML(item.timestamp)}</span>
          </div>
          <div class="card-body">
            ${escapeHTML(item.message).replace(/\n/g, '<br>')}
          </div>
        `;

        grid.appendChild(card);
      });
    }

    /**
     * 啟動 3 秒計時器輪播特效
     */
    function startCarousel() {
      // 立即執行第一次高亮
      highlightNextCard();

      // 設定每隔 ROTATE_INTERVAL 毫秒切換一次
      carouselTimer = setInterval(() => {
        highlightNextCard();
      }, ROTATE_INTERVAL);
    }

    /**
     * 控制卡片高亮與變暗的切換邏輯
     */
    function highlightNextCard() {
      const allCards = document.querySelectorAll('.card');
      if (allCards.length === 0) return;

      // 更新索引，循環播報 (0 -> 1 -> 2 -> ... -> 0)
      currentIndex = (currentIndex + 1) % allCards.length;

      allCards.forEach((card, idx) => {
        if (idx === currentIndex) {
          // 當前卡片：加上高亮標籤，移除暗化標籤
          card.classList.add('highlight');
          card.classList.remove('dimmed');
          
          // 平滑滾動確保高亮卡片維持在可見視野內 (可選優化)
          card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } else {
          // 其他卡片：移除高亮，加上暗化標籤
          card.classList.remove('highlight');
          card.classList.add('dimmed');
        }
      });
    }

    /**
     * 防止 XSS 攻擊的安全轉義函數
     */
    function escapeHTML(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
