<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friends' Board | 朋友對我的動態留言板</title>
  
  <!-- 引入 Google Fonts 提升歐美質感字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       【1. 全局樣式與顏色變數定義 (CSS Variables)】
       您可以透過修改這裡的顏色碼，快速更換整體網頁視覺風格！
       ========================================================================== */
    :root {
      /* 背景主色 (深邃極致黑/暗灰) */
      --bg-color: #0d0f12;
      /* 網頁主題漸層背景 */
      --bg-gradient: radial-gradient(circle at 50% 0%, #1a1f29 0%, #0d0f12 70%);
      
      /* 文字顏色 */
      --text-main: #f0f2f5;        /* 主文字 (亮灰白) */
      --text-muted: #8c96a3;       /* 次要文字 / 時間 (灰藍) */
      --text-accent: #e2b714;      /* 強調字體 / 金色 */

      /* 卡片預設樣式 */
      --card-bg: rgba(255, 255, 255, 0.03);  /* 卡片半透明背景 */
      --card-border: rgba(255, 255, 255, 0.08); /* 卡片細緻邊框 */
      
      /* 【輪播焦點卡片發光樣式 - 可自行調整】 */
      --highlight-border: #e2b714;               /* 輪播焦點邊框顏色 (暖金) */
      --highlight-shadow: 0 0 30px rgba(226, 183, 20, 0.35); /* 焦點發光光暈 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-color);
      background-image: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* ==========================================================================
       【2. 頁頭標題 (Header Style)】
       ========================================================================== */
    header {
      text-align: center;
      margin-bottom: 3rem;
      max-width: 800px;
    }

    header h1 {
      font-family: 'Cinzel', serif; /* 歐美古典襯線字體 */
      font-size: 2.8rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
      letter-spacing: 1px;
    }

    /* ==========================================================================
       【3. 載入中酷炫動畫 (Loading Animation)】
       ========================================================================== */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 5rem;
      gap: 1.5rem;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid var(--text-accent);
      border-radius: 50%;
      animation: spin 1s infinite linear;
      box-shadow: 0 0 15px rgba(226, 183, 20, 0.2);
    }

    #loading p {
      letter-spacing: 2px;
      font-size: 1.1rem;
      color: var(--text-accent);
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* ==========================================================================
       【4. 瀑布流排版 (Masonry Layout)】
       ========================================================================== */
    .masonry-container {
      width: 100%;
      max-width: 1200px;
      
      /* 預設桌面端：3 直欄 */
      column-count: 3;
      column-gap: 1.5rem;
      
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
    }

    /* 響應式斷點 (RWD) */
    @media (max-width: 900px) {
      .masonry-container { column-count: 2; } /* 平板：2 欄 */
    }
    @media (max-width: 600px) {
      .masonry-container { column-count: 1; } /* 手機：1 欄 */
    }

    /* ==========================================================================
       【5. 留言卡片與輪播特效 (Card Styles & Focus Effect)】
       ========================================================================== */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(10px); /* 歐美毛玻璃質感 */
      -webkit-backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      break-inside: avoid; /* 防止卡片在瀑布流中被跨欄切斷 */
      
      /* 平滑過渡動畫 (針對輪播縮放發光) */
      transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      position: relative;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 0.5rem;
    }

    .card-name {
      font-weight: 600;
      font-size: 1.1rem;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .card-time {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .card-content {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #d1d5db;
      white-space: pre-line; /* 保留留言換行格式 */
    }

    /* ---【重點：輪播特效狀態 class】--- */
    
    /* 1. 被焦點選中的卡片 (亮起 + 放大) */
    .card.highlight {
      transform: scale(1.05); /* 放大 1.05 倍 */
      border-color: var(--highlight-border);
      box-shadow: var(--highlight-shadow);
      background: rgba(255, 255, 255, 0.08);
      z-index: 10;
    }

    /* 2. 沒被選中的卡片 (變暗 + 模糊) */
    .masonry-container.has-highlight .card:not(.highlight) {
      opacity: 0.35;        /* 降低透明度變暗 */
      filter: blur(1.5px);   /* 微模糊效果 */
      transform: scale(0.98);/* 稍微縮小 */
    }
  </style>
</head>
<body>

  <!-- 頁頭 -->
  <header>
    <h1>Friends' Messages</h1>
    <p>MEMORIES & MESSAGES FROM FRIENDS</p>
  </header>

  <!-- 載入中動畫 -->
  <div id="loading">
    <div class="spinner"></div>
    <p>讀取留言中...</p>
  </div>

  <!-- 瀑布流留言牆容器 -->
  <div id="masonry" class="masonry-container"></div>

  <script>
    // ==========================================================================
    // 【6. JavaScript 邏輯控制區】
    // ==========================================================================

    /* 
     * 【顏色與輪播參數設定區】
     * 這裡可以輕鬆調控輪播的頻率與時間！
     */
    const CONFIG = {
      // 輪播切換間隔時間 (單位：毫秒)，3000ms = 3 秒
      INTERVAL_TIME: 3000, 
      
      // Google 試算表 CSV 發布網址
      CSV_URL: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRui0YoQv7ayzy5_vEY-upzlzIaqniANv-4ILn1y8kRvG7pSQ4tZ-voRNsTMTSUrDdIGwprUmqZ8oM_/pub?output=csv'
    };

    let cardsData = [];      // 儲存解析後的留言資料
    let currentIndex = -1;   // 目前輪播高亮的卡片索引
    let carouselTimer = null;// 輪播計時器

    // 網頁載入完成後發動
    document.addEventListener('DOMContentLoaded', () => {
      fetchCSVData();
    });

    /**
     * 從 Google 試算表 CSV 網址 fetch 資料
     */
    async function fetchCSVData() {
      try {
        const response = await fetch(CONFIG.CSV_URL);
        const csvText = await response.text();
        
        // 解析 CSV 資料
        cardsData = parseCSV(csvText);
        
        // 隱藏載入動畫、顯示瀑布流
        document.getElementById('loading').style.display = 'none';
        const container = document.getElementById('masonry');
        container.style.opacity = '1';

        // 渲染卡片到畫面上
        renderCards(cardsData);

        // 如果有資料，啟動 3 秒輪播特效
        if (cardsData.length > 0) {
          startCarousel();
        }

      } catch (error) {
        console.error('Fetch CSV 失敗:', error);
        document.getElementById('loading').innerHTML = '<p style="color: #ef4444;">資料讀取失敗，請確認網址或權限設定。</p>';
      }
    }

    /**
     * 嚴謹解析 CSV 文本 (妥善處理留言欄位中可能包含逗號、換行與雙引號的情況)
     */
    function parseCSV(text) {
      const lines = [];
      let row = [];
      let inQuotes = false;
      let currentToken = '';

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (inQuotes && nextChar === '"') {
            currentToken += '"';
            i++; // 跳過轉義的雙引號
          } else {
            inQuotes = !inQuotes; // 切換雙引號狀態
          }
        } else if (char === ',' && !inQuotes) {
          row.push(currentToken.trim());
          currentToken = '';
        } else if ((char === '\r' || char === '\n') && !inQuotes) {
          if (char === '\r' && nextChar === '\n') {
            i++; // 處理 Windows 換行符 \r\n
          }
          row.push(currentToken.trim());
          if (row.length > 1 || row[0] !== '') {
            lines.push(row);
          }
          row = [];
          currentToken = '';
        } else {
          currentToken += char;
        }
      }
      if (currentToken || row.length > 0) {
        row.push(currentToken.trim());
        lines.push(row);
      }

      // 假設第一行是標題 (時間戳記, 姓名, 敲敲話)，去掉第一行
      const dataRows = lines.slice(1);

      // 將每列轉為物件結構
      return dataRows.map(cols => {
        return {
          timestamp: cols[0] || '', // 時間戳記
          name: cols[1] || '匿名朋友', // 姓名
          message: cols[2] || ''    // 敲敲話 (留言)
        };
      }).filter(item => item.message !== ''); // 過濾空留言
    }

    /**
     * 將資料動態生成 HTML 卡片並插入瀑布流容器中
     */
    function renderCards(data) {
      const container = document.getElementById('masonry');
      container.innerHTML = '';

      data.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.index = index; // 綁定索引供輪播使用

        // 格式化日期格式 (簡單清理原生的時間字串)
        const formattedTime = item.timestamp ? item.timestamp.split(' ')[0] : '';

        card.innerHTML = `
          <div class="card-header">
            <span class="card-name">${escapeHTML(item.name)}</span>
            <span class="card-time">${escapeHTML(formattedTime)}</span>
          </div>
          <div class="card-content">${escapeHTML(item.message)}</div>
        `;

        container.appendChild(card);
      });
    }

    /**
     * 啟動隨時間輪播特效 (setInterval)
     */
    function startCarousel() {
      const container = document.getElementById('masonry');
      
      // 標記容器開啟焦點模式 (啟用非焦點卡片的模糊變暗)
      container.classList.add('has-highlight');

      // 立即執行第一次
      highlightNextCard();

      // 設定每隔特定秒數 (預設 3 秒) 自動輪播下張卡片
      carouselTimer = setInterval(() => {
        highlightNextCard();
      }, CONFIG.INTERVAL_TIME);
    }

    /**
     * 切換下一張卡片 Highlight
     */
    function highlightNextCard() {
      const cards = document.querySelectorAll('.card');
      if (cards.length === 0) return;

      // 移除上一個高亮狀態
      if (currentIndex >= 0 && cards[currentIndex]) {
        cards[currentIndex].classList.remove('highlight');
      }

      // 遞增索引值 (到最後一張後回到第 0 張)
      currentIndex = (currentIndex + 1) % cards.length;

      // 加上當前高亮狀態
      const targetCard = cards[currentIndex];
      targetCard.classList.add('highlight');

      // (選用) 確保視野能順暢看到正高亮顯示的卡片
      targetCard.scrollIntoView({
        behavior: 'smooth',
        block: 'nearest'
      });
    }

    /**
     * 防範 XSS 攻擊的簡單字串轉義函式
     */
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }
  </script>
</body>
</html>
